name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # renovate: datasource=crate depName=cargo-audit
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .ci/changed-components.sh
      - name: Install cargo-audit
        if: steps.scope.outputs.audit == 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Check the lockfile against RustSec advisories
        if: steps.scope.outputs.audit == 'true'
        run: python3 .ci/audit.py

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .ci/changed-components.sh
      - name: Install the repository toolchain
        if: steps.scope.outputs.rust == 'true'
        run: rustup show active-toolchain
      - name: Validate release reference
        run: python3 .ci/release_ref.py
      - name: Test repository tooling
        if: steps.scope.outputs.python == 'true'
        run: python3 -m unittest discover -s .ci -p 'test_*.py'
      - name: Format
        if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --all --check
      - name: Clippy
        if: steps.scope.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --workspace --all-features --locked
      - name: Rust documentation
        if: steps.scope.outputs.rust == 'true'
        run: cargo doc --workspace --no-deps --locked

  verify-image:
    needs: [audit, test]
    outputs:
      image: ${{ steps.scope.outputs.image }}
      publish: ${{ steps.scope.outputs.publish }}
      tls: ${{ steps.scope.outputs.tls }}
      quickstart: ${{ steps.scope.outputs.quickstart }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .ci/changed-components.sh
      - name: Build from public dependencies
        if: steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true')
        run: docker build --tag mcp-ssh-ci .
      - name: Check the container
        if: steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true')
        run: python3 .ci/smoke_image.py mcp-ssh-ci
      - name: Verify outbound TLS
        if: steps.scope.outputs.tls == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true')
        run: python3 .ci/verify_https.py --image mcp-ssh-ci
      - name: Exercise the standalone Quickstart
        if: steps.scope.outputs.quickstart == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true')
        run: python3 .ci/verify_quickstart.py mcp-ssh-ci

  publish:
    needs: [audit, test, verify-image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.verify-image.outputs.publish == 'true'
    concurrency:
      group: mcp-ssh-rs-image-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build in this trusted job rather than loading an artifact from a PR.
      - name: Build the publication candidate
        run: |
          docker build --tag mcp-ssh-publish \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
      - name: Check the publication candidate
        run: python3 .ci/smoke_image.py mcp-ssh-publish
      - name: Verify publication candidate outbound TLS
        if: needs.verify-image.outputs.tls == 'true'
        run: python3 .ci/verify_https.py --image mcp-ssh-publish
      - name: Exercise publication candidate Quickstart
        if: needs.verify-image.outputs.quickstart == 'true'
        run: python3 .ci/verify_quickstart.py mcp-ssh-publish
      - name: Publish to GHCR and verify the image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          image_id=$(docker image inspect --format '{{.Id}}' mcp-ssh-publish)
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "$image_id" "$image"
          docker push "$image"
          docker image rm "$image"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Id}}' "$image")" = "$image_id"
          docker image inspect --format '{{json .RepoDigests}}' "$image"
