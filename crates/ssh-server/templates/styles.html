<link rel="icon" href="/dashboard/assets/brand.svg" type="image/svg+xml">
<style>
@font-face { font-family:Manrope; src:url('/dashboard/assets/Manrope.ttf') format('truetype'); font-weight:200 800; font-display:swap; }
@font-face { font-family:'IBM Plex Mono'; src:url('/dashboard/assets/IBMPlexMono-Regular.ttf') format('truetype'); font-weight:400; font-display:swap; }
:root { color-scheme:light dark; --bg:#f7f5f0; --panel:#fff; --raised:#f0ece4; --border:#c5bdb0; --soft:#ded8ce; --text:#23201b; --muted:#655e53; --accent:#884729; --positive:#1e5f46; --negative:#9e3030; --warning:#775213; --code:#f4f1eb; }
@media(prefers-color-scheme:dark) { :root { --bg:#23201b; --panel:#2b2822; --raised:#342f28; --border:#756a5b; --soft:#51493e; --text:#f7f5f0; --muted:#c4baab; --accent:#df9b76; --positive:#9dd5b6; --negative:#ffa7a0; --warning:#ebc27b; --code:#201d18; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:Manrope,ui-sans-serif,system-ui,sans-serif; line-height:1.6; overflow-wrap:anywhere; }
a { color:var(--accent); text-underline-offset:.2em; }
a:hover { text-decoration-thickness:2px; }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
.skip-link { position:absolute; z-index:2; left:1rem; top:-8rem; padding:.75rem; background:var(--panel); }
.skip-link:focus { top:1rem; }
.shell { min-height:100vh; display:grid; grid-template-columns:16rem minmax(0,1fr); }
.sidebar { border-right:1px solid var(--soft); padding:1.5rem 1rem; display:flex; flex-direction:column; gap:2rem; }
.brand { display:flex; align-items:center; gap:.6rem; color:var(--text); font-weight:750; font-size:1.15rem; text-decoration:none; }
.brand img { width:2.5rem; height:2.5rem; }
nav { display:grid; gap:.4rem; }
.nav-item { display:flex; align-items:center; gap:.65rem; border-radius:.6rem; color:var(--muted); padding:.65rem .75rem; text-decoration:none; min-height:44px; }
.nav-item.active { background:var(--raised); color:var(--text); box-shadow:inset 3px 0 var(--accent); font-weight:700; }
.icon { width:1.25rem; height:1.25rem; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.sidebar-foot { margin-top:auto; border-top:1px solid var(--soft); padding:1rem .5rem 0; color:var(--muted); font-size:.85rem; }
main { min-width:0; }
.topbar { min-height:5rem; border-bottom:1px solid var(--soft); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; padding:1rem clamp(1rem,3vw,2.5rem); }
.eyebrow { margin:0 0 .2rem; color:var(--accent); font-size:.85rem; font-weight:700; }
h1,h2,h3,p { margin-top:0; }
h1 { margin-bottom:0; font-size:clamp(1.5rem,3vw,2rem); letter-spacing:-.025em; }
h2 { font-size:1.2rem; }
.operator,.muted { color:var(--muted); font-size:.9rem; }
.operator strong { color:var(--text); }
.content { max-width:96rem; margin:0 auto; padding:clamp(1rem,3vw,2.5rem); }
.summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.8rem; margin-bottom:2rem; }
.summary .metric { border:1px solid var(--soft); background:var(--panel); border-radius:.7rem; padding:1rem; font-size:1rem; font-weight:400; }
.metric { font-size:1.5rem; font-weight:750; }
.metric span { color:var(--muted); display:block; font-size:.85rem; }
.metric strong { display:block; font-size:1.65rem; margin-top:.2rem; }
.section-head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:.7rem; align-items:center; margin:1.5rem 0 .8rem; }
.section-head > div { min-width:0; }
.section-head h2,.section-head p { margin:0; }
.section-head p { color:var(--muted); font-size:.9rem; }
.empty { border:1px dashed var(--border); border-radius:.8rem; padding:2rem 1rem; text-align:center; color:var(--muted); background:var(--panel); }
article { border:1px solid var(--border); border-radius:.8rem; background:var(--panel); margin:0 0 1rem; min-width:0; scroll-margin-top:1rem; }
article:target { outline:2px solid var(--accent); outline-offset:3px; }
.request-head { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:1rem; padding:1rem; border-bottom:1px solid var(--soft); border-radius:.8rem .8rem 0 0; background:var(--raised); }
.request-head > div { min-width:0; }
.request-head h3 { margin:0 0 .3rem; font-size:1rem; overflow-wrap:anywhere; }
.identifier,.digest { color:var(--muted); font-size:.85rem; }
.identifier,.digest,.mono,code,.argv,.output { font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace; overflow-wrap:anywhere; }
.risk,.badge { border:1px solid var(--border); border-radius:.5rem; color:var(--muted); padding:.2rem .55rem; font-size:.85rem; max-width:100%; }
.risk { color:var(--warning); }
.badge.good { color:var(--positive); }
.badge.bad { color:var(--negative); }
.request-grid { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(17rem,.75fr); }
.request-main,.request-context { padding:1.15rem; min-width:0; }
.request-context { border-left:1px solid var(--soft); }
dl { margin:.75rem 0 0; display:grid; grid-template-columns:8rem minmax(0,1fr); column-gap:.8rem; }
dt { color:var(--muted); font-size:.85rem; padding:.34rem 0; }
dd { margin:0; padding:.34rem 0; min-width:0; }
.argv-label { margin:0 0 .45rem; color:var(--muted); font-size:.85rem; }
.argv { background:var(--code); border:1px solid var(--soft); border-radius:.55rem; margin:0; padding:.8rem .8rem .8rem 3rem; font-size:.9rem; }
.argv li { white-space:pre-wrap; padding-left:.35rem; }
.argv li::marker { color:var(--muted); }
.output { background:var(--code); border:1px solid var(--soft); border-radius:.5rem; padding:.8rem; white-space:pre-wrap; font-size:.9rem; }
.reason,.assessment { margin:.9rem 0; border-left:3px solid var(--warning); background:var(--raised); padding:.75rem; }
.notice { border:1px solid var(--border); background:var(--raised); border-radius:.65rem; padding:.8rem 1rem; margin-bottom:1.2rem; }
form.actions { display:flex; flex-wrap:wrap; align-items:center; gap:.7rem; border-top:1px solid var(--soft); padding:1rem; }
button,select,input { font:inherit; min-height:44px; min-width:0; border:1px solid #8e8477; border-radius:.5rem; background:var(--panel); color:var(--text); padding:.55rem .8rem; }
@media(prefers-color-scheme:dark) { button,select,input { border-color:#948775; } }
button { cursor:pointer; font-weight:700; }
button:hover { border-color:var(--text); background:var(--raised); }
.approve { background:#1e5f46; border-color:#1e5f46; color:#fff; }
.approve:hover { background:#174c38; color:#fff; }
.refuse { color:var(--negative); }
.session { margin-left:auto; }
.duration { color:var(--muted); font-size:.9rem; display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; min-width:0; max-width:100%; }
.duration select { max-width:100%; }
.agreements { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(20rem,100%),1fr)); gap:.8rem; }
.agreement { padding:1rem; margin:0; }
.agreement p { color:var(--muted); margin-bottom:.75rem; }
.agreement strong,.agreement code { color:var(--text); }
.cards { display:grid; gap:1rem; }
.card { padding:1rem; margin:0; }
.head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:1rem; }
.head > div { min-width:0; }
.head h2,.head h3 { margin:0; font-size:1rem; }
.filters { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.7rem; margin-bottom:1rem; }
.filters label { display:grid; gap:.3rem; color:var(--muted); font-size:.9rem; min-width:0; }
.filters button { align-self:end; }
.effects { margin:.5rem 0 0; }
.roles { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.8rem; }
.journey { border-left:3px solid var(--accent); }
.steps { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.55rem; margin:.8rem 0; }
.step { border:1px solid var(--soft); border-radius:.55rem; padding:.65rem; background:var(--code); min-width:0; }
.step strong { display:block; color:var(--accent); font-size:.85rem; margin-bottom:.3rem; }
.deep-link { display:inline-block; margin-top:.8rem; padding:.4rem 0; }
.pager { display:flex; justify-content:flex-end; margin-top:1rem; }
.pager a { border:1px solid var(--border); border-radius:.5rem; padding:.65rem .8rem; }
@media(max-width:1000px) { .steps { grid-template-columns:1fr 1fr; } }
@media(max-width:850px) { .shell { grid-template-columns:1fr; } .sidebar { border-right:0; border-bottom:1px solid var(--soft); padding:1rem; gap:1rem; } nav { display:flex; flex-wrap:wrap; } .sidebar-foot { display:none; } .request-grid { grid-template-columns:1fr; } .request-context { border-left:0; border-top:1px solid var(--soft); } .filters { grid-template-columns:1fr 1fr; } }
@media(max-width:560px) { .summary,.filters,.steps { grid-template-columns:1fr; } .topbar { align-items:flex-start; flex-direction:column; } dl { grid-template-columns:1fr; } dt { padding-bottom:0; } .session { margin-left:0; } form.actions { align-items:stretch; } form.actions button { flex:1 1 auto; } .duration { flex:1 0 100%; } }
</style>
