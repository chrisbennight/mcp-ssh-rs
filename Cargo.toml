[workspace]
resolver = "3"
members = [
    "crates/ssh-core",
    "crates/ssh-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/chrisbennight/mcp-ssh-rs"

[workspace.dependencies]
anyhow = "1"
aws-lc-rs = "1.18"
askama = "0.16"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10"
rsa = "0.10.0-rc.18"
rmcp = { version = "=2.2.0", default-features = false, features = [
    "server",
    # The transport the gateway speaks to upstreams. Enabled here rather than in
    # the surface crate so the version and its features stay one decision.
    "transport-streamable-http-server",
] }
# Rustls uses the AWS-LC provider already used for RSA authentication.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
russh = "0.62"
russh-sftp = "2.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ssh-core = { path = "crates/ssh-core" }
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The service's failure modes are security-relevant: a panic in a request path
# takes down mediation for every caller, and a silent truncation or wrap in a
# size or duration calculation is exactly the kind of bug that turns a bounded
# operation into an unbounded one.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
