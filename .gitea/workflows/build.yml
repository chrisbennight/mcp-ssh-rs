name: build

# Only main publishes. A release tag would also reach the credential-bearing
# publish step, and nothing tags releases here, so the trigger does not carry
# an event this workflow was not written for.
on:
  push:
    branches: [main]
  pull_request:

# :latest points at the most recently completed publishing run, which is not the
# same as the newest commit. Runs are concurrent and can be rerun, so a slower or
# replayed run can finish last and leave :latest behind the branch - until the
# next push, which moves it forward again.
#
# That is deliberate, after trying three mechanisms to prevent it: serializing
# runs, which silently dropped superseded commits' own tags; identifying tags by
# image ID, which cannot tell an identical build apart; and comparing commit
# ancestry before pushing, which is a read and a write with a gap in between and
# so is not a guarantee either. A registry offers no way to move a tag
# conditionally, so nothing short of an external lock makes this atomic, and an
# external lock is a great deal of machinery for a pointer that self-corrects.
#
# What a deployment needing an exact commit uses is the sha tag: every completed
# run publishes one for its own commit, and no other commit's run ever writes
# it. Rerunning a commit does republish that commit's tag, so it is not
# write-once - what it always names is an image built from that commit, which
# is the property a deployment pinning it depends on. Enforcing write-once is a
# registry policy, not something this workflow can assert about itself.

env:
  IMAGE: gitea.cacahuate.org/bennight/mcp-ssh-rs

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built under a name no other run uses, then pinned to the image ID that
      # name resolved to. Everything after this refers to the ID.
      #
      # A shared tag would let concurrent runs on one daemon retag it between
      # steps, so a push could publish an image another run built - including a
      # pull request's. An ID cannot be retagged out from under this run.
      #
      # The revision label makes a published image say which commit built it,
      # so an operator holding an image can find its source without consulting
      # a tag that may since have moved.
      - name: Build image
        id: build
        run: |
          set -euo pipefail
          local_tag="${IMAGE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The runner carries the crate proxy's address; the build cannot see
          # the job's environment, so it is passed in explicitly. Naming the
          # argument without its value would forward nothing, and forwarding it
          # empty would write a config file naming an empty registry - so an
          # absent value means no flag at all, and cargo resolves from crates.io.
          index_build_args=()
          if [ -n "${CRATES_INDEX_URL:-}" ]; then
            index_build_args=(--build-arg "CRATES_INDEX_URL=${CRATES_INDEX_URL}")
          fi
          docker build \
            "${index_build_args[@]}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$local_tag" .
          image_id="$(docker image inspect --format '{{.Id}}' "$local_tag")"
          echo "local_tag=$local_tag" >> "$GITHUB_OUTPUT"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      # A build argument that is declared but never reaches cargo looks exactly
      # like one that works: both leave a green build, because the fallback
      # resolves from crates.io either way. Pointing it at a closed port
      # separates them - the build stage has to fail, and one that succeeds
      # proves nothing was redirected.
      #
      # Skipped rather than passed when the runner supplies no address: with
      # nothing to redirect, reaching crates.io is the intended behaviour and
      # there is no failure to demand.
      - name: Check the crate index argument is load-bearing
        run: |
          set -euo pipefail
          if [ -z "${CRATES_INDEX_URL:-}" ]; then
            echo "SKIP: no crate index configured, so crates.io is the correct source"
            exit 0
          fi
          probe_tag="${IMAGE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-probe"
          if docker build \
              --build-arg "CRATES_INDEX_URL=sparse+http://127.0.0.1:9/index/" \
              --target build --tag "$probe_tag" . >/dev/null 2>&1; then
            docker image rm "$probe_tag" >/dev/null 2>&1 || true
            echo "the build resolved crates without consulting CRATES_INDEX_URL" >&2
            exit 1
          fi
          echo "cargo failed against the unreachable index, as required"

      # Starts the image the way it is meant to run - read-only root, no
      # capabilities, no new privileges - because an image that only works with
      # more than it should have is one that will be given more than it should
      # have.
      - name: Smoke the image under its deployed restrictions
        env:
          LOCAL_TAG: ${{ steps.build.outputs.local_tag }}
        run: |
          set -euo pipefail
          container="mcp-ssh-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            # Reported rather than swallowed. The trap runs on the way out, so
            # failing here would replace whatever the step was actually saying,
            # but a container left running on a runner is something an operator
            # has to be told about rather than left to find.
            if ! docker rm -f "$container" >/dev/null 2>&1; then
              echo "warning: $container could not be removed and may still be running" >&2
            fi
            docker rmi -f "${container}-image" >/dev/null 2>&1 || true
            rm -f smoke-key smoke-key.pub
          }
          trap cleanup EXIT
          # The service resolves its settings before it binds, so starting it
          # with none tests only that it refuses to start. These are the
          # smallest that let it come up: one registry reference, an ephemeral
          # private key held under its exact folded environment name, and a
          # gateway it never has to reach because this step makes no request.
          #
          # The registry arrives as a layer over the built image. A mount will
          # not do: the daemon runs beside the job rather than in it, so a path
          # from here means nothing to it. Nor will copying into the container,
          # which the daemon refuses once the root filesystem is read-only —
          # and running it writable would test something other than how it is
          # deployed.
          #
          # Based on the tag rather than the image ID, which the builder will
          # not accept in a FROM. The tag names this run and no other, so
          # nothing else can move it; the steps that assert what was published
          # still work from the ID.
          command -v ssh-keygen >/dev/null
          ssh-keygen -q -t ed25519 -N '' -f smoke-key
          credential="$(cat smoke-key)"
          printf '%s\n' \
            '{"smoke":{"address":"127.0.0.1:22","host_key":"SHA256:AAAA1111","roles":{"readonly":{"user":"nobody","credential":"mcp-ssh/smoke/readonly"}}}}' \
            > registry.json
          printf 'FROM %s\nCOPY registry.json /etc/mcp-ssh/registry.json\n' "$LOCAL_TAG" \
            > Dockerfile.smoke
          docker build -f Dockerfile.smoke -t "${container}-image" . >/dev/null
          docker run -d --name "$container" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            -e MCP_SSH_REGISTRY=/etc/mcp-ssh/registry.json \
            -e MCP_SSH_CREDENTIAL_MCP_SSH_SMOKE_READONLY="$credential" \
            -e MCP_SSH_GATEWAY_BEARER_CURRENT=smoke-not-a-real-credential-000000 \
            -e MCP_SSH_PROXY_BEARER_CURRENT=smoke-not-a-real-proxy-value-00000 \
            -e MCP_SSH_IDENTITY_JWKS_URL=http://gateway.invalid/.well-known/jwks.json \
            -e MCP_SSH_IDENTITY_ISSUER=https://mcp.cacahuate.org \
            "${container}-image" >/dev/null
          ready=0
          for _ in $(seq 1 30); do
            if docker exec "$container" /mcp-ssh-rs --healthcheck >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker logs "$container"
            exit 1
          fi

      # Asserts against the built image rather than the Dockerfile, which can
      # say anything.
      - name: Check the image runs as nobody privileged
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          set -euo pipefail
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE_ID")"
          test "$user" = "nonroot:nonroot"
          healthcheck="$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$IMAGE_ID")"
          test "$healthcheck" = '["CMD","/mcp-ssh-rs","--healthcheck"]'

      # Fetched here rather than at the start of the job, so the credential is
      # present for the push and nothing else. A pull request never reaches this
      # step, so the build and both checks run without one at all.
      - name: Fetch registry credentials
        if: github.event_name != 'pull_request'
        uses: https://gitea.cacahuate.org/bennight/infisical-secrets-action@b3c3a026c643086539d389c0a7e001eefbf72da0 # v1.0.0
        with:
          api-url: https://infisical.cacahuate.org
          client-id: ${{ vars.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: b03f80d8-53dd-4cd3-9b09-7f4770dc3ffe
          secret-path: /bennight/mcp-ssh-rs
          secrets: |
            REGISTRY_USER
            REGISTRY_TOKEN

      # Published tags are applied to the ID that was just validated, and the
      # registry is then read back to confirm that is what arrived.
      #
      # Naming an image and pushing that name are two operations, so a daemon
      # running two jobs at once could in principle have the name retagged in
      # between. This fleet's runners each own their Docker daemon and take one
      # job at a time, so that interleaving does not arise - but the check after
      # the push does not depend on that being true. It asks the registry what
      # the tag now resolves to, so a topology change turns a silent
      # publication of the wrong artifact into a failed run.
      - name: Publish image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login gitea.cacahuate.org --username "$REGISTRY_USER" --password-stdin
          short_sha="${GITHUB_SHA::12}"
          publish_as() {
            docker tag "$IMAGE_ID" "$1"
            resolved="$(docker image inspect --format '{{.Id}}' "$1")"
            if [ "$resolved" != "$IMAGE_ID" ]; then
              echo "refusing to publish $1: it resolves to $resolved, not the validated image" >&2
              exit 1
            fi
            docker push "$1"
            # Read back from the registry, which is the only place that can say
            # what was actually published. Removing the local name first means
            # the pull cannot be answered from the daemon's own cache.
            docker image rm "$1" >/dev/null 2>&1 || true
            docker pull --quiet "$1" >/dev/null
            published="$(docker image inspect --format '{{.Id}}' "$1")"
            if [ "$published" != "$IMAGE_ID" ]; then
              echo "published $1 resolves to $published, not the image this run validated" >&2
              exit 1
            fi
          }
          publish_as "${IMAGE}:sha-${short_sha}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            publish_as "${IMAGE}:latest"
          fi

      # Removes the name this run invented, and only that.
      #
      # Published names are deliberately left alone. Identifying them by the
      # image ID they resolve to looks more precise but is not: a build of
      # identical content produces the same ID, so a pull request run whose
      # source happens to match main's would recognise main's :latest as its
      # own and untag it. Runs are not serialized at all here, so nothing
      # rules that overlap out.
      #
      # Leaving the published names in place costs nothing: the next run to
      # publish overwrites them, and the fleet's nightly runner prune reclaims
      # the layers.
      - name: Remove this run's images
        if: always()
        env:
          LOCAL_TAG: ${{ steps.build.outputs.local_tag }}
        run: |
          set -euo pipefail
          [ -n "${LOCAL_TAG:-}" ] || exit 0
          docker image rm "$LOCAL_TAG" >/dev/null 2>&1 || true

  # Publishing :latest does not change docker-home, and registry polling is
  # disabled so config updates stay behind docker-home's registry and
  # credential-sync gates. This image-only path changes neither, so trigger
  # Komodo only after the validated image has been published; a failed build
  # leaves the last-good deployment running. Config changes continue through
  # docker-home's deploy-mcp-ssh workflow.
  trigger-komodo-deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fetch only after the image job succeeds. An exact-name Infisical
      # privilege reads the Docker Home value that Komodo Core itself consumes,
      # without granting access to other Docker Home secrets.
      - name: Fetch Komodo webhook secret
        uses: https://gitea.cacahuate.org/bennight/infisical-secrets-action@b3c3a026c643086539d389c0a7e001eefbf72da0 # v1.0.0
        with:
          api-url: https://infisical.cacahuate.org
          client-id: ${{ vars.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: b03f80d8-53dd-4cd3-9b09-7f4770dc3ffe
          secret-path: /bennight/docker-home
          secrets: KOMODO_WEBHOOK_SECRET

      - name: Trigger Komodo deployment
        env:
          WEBHOOK_SECRET: ${{ env.KOMODO_WEBHOOK_SECRET }}
          REPO_FULL_NAME: ${{ github.repository }}
          REPO_SERVER_URL: ${{ github.server_url }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
          GIT_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          STACK_ID: 6a835af419629bec61b7037e
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_SECRET:-}" ]; then
            echo "KOMODO_WEBHOOK_SECRET is empty; refusing to report a deployment" >&2
            exit 1
          fi

          webhook_out=$(python3 .ci/komodo_webhook.py)
          payload=${webhook_out%%$'\n'*}
          signature=${webhook_out##*$'\n'}
          if [ -z "$signature" ] || [ "$signature" = "$payload" ]; then
            echo "failed to build the Komodo webhook payload and signature" >&2
            exit 1
          fi

          body_file=$(mktemp)
          cleanup() {
            rm -f "$body_file"
          }
          trap cleanup EXIT
          if ! http_code=$(curl -s -o "$body_file" -w "%{http_code}" \
              --max-time 60 --retry 2 --retry-connrefused \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              -H "X-GitHub-Delivery: ${RUN_ID}-${RUN_ATTEMPT}" \
              -H "X-Hub-Signature-256: sha256=$signature" \
              -d "$payload" \
              "https://komodo.cacahuate.org/listener/github/stack/${STACK_ID}/deploy"); then
            echo "Komodo deployment webhook failed after bounded retries" >&2
            exit 1
          fi

          response=$(<"$body_file")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Komodo deployment webhook returned HTTP $http_code: $response" >&2
            exit 1
          fi
          echo "Komodo accepted the mcp-ssh deployment trigger"
